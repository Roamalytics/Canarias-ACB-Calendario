name: Update calendar

# Runs daily at 05:17 UTC. Also runnable by hand from the Actions tab.
# This runs on GitHub's servers. Cursor does not need to be connected to the repo.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update calendars
        id: scrape
        continue-on-error: true
        run: python update_calendar.py

      - name: Open issue if the club page scrape failed
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Calendar scrape failed";
            const body = [
              "update_calendar.py exited with an error (club page returned too few fixtures, or a request failed).",
              "",
              "Check the failed Actions run. The .ics files were not changed.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failed again in run ${context.runId}.\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Commit if calendars changed
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.ics
          [ -f last_run.txt ] && git add last_run.txt
          [ -f last_crosscheck.md ] && git add last_crosscheck.md
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "Update Canarias basketball calendars"
          git push
